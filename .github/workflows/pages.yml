name: Deploy reconstructed single-player game to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'reconstruction/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: JavaScript syntax checks
        run: npm run check --prefix reconstruction
      - name: Game and backup unit tests
        run: npm test --prefix reconstruction
  deploy:
    needs: verify
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Stage only public static game assets
        run: |
          mkdir -p _site
          cp reconstruction/index.html _site/index.html
          cp -R reconstruction/src _site/src
          touch _site/.nojekyll
          test -s _site/index.html
          test -s _site/src/app.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
